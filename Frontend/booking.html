<form id="bookingForm" enctype="multipart/form-data">

<div class="inputBox">

<script>
const bookingForm = document.getElementById('bookingForm');
const submitButton = bookingForm.querySelector('button[type="submit"]');
const statusMessage = document.getElementById('statusMessage');
const dateInput = bookingForm.querySelector('input[name="date"]');
const timeInput = bookingForm.querySelector('input[name="time"]');

function getTodayString() {
  const today = new Date();
  return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
}

function isFutureDateTime(dateValue, timeValue) {
  if (!dateValue || !timeValue) return false;

  const [year, month, day] = dateValue.split('-').map(Number);
  const [hours, minutes] = timeValue.split(':').map(Number);

  const selectedDateTime = new Date(year, month - 1, day, hours, minutes);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if (selectedDateTime < today) {
    return false;
  }

  if (selectedDateTime.getTime() === today.getTime()) {
    return selectedDateTime > now;
  }

  return true;
}

function validateBookingDateTime() {
  if (!isFutureDateTime(dateInput.value, timeInput.value)) {
    alert('Please choose a future date and time. Past or current slots are not available.');
    return false;
  }
  return true;
}

dateInput.min = getTodayString();

dateInput.addEventListener('change', function () {
  if (dateInput.value === getTodayString()) {
    const now = new Date();
    const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    timeInput.min = currentTime;
  } else {
    timeInput.removeAttribute('min');
  }
});

bookingForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  if (!validateBookingDateTime()) {
    return;
  }

  const form = e.target;
  const url = 'http://localhost:8000/booking';
  const data = new FormData(form);

  submitButton.disabled = true;
  submitButton.textContent = 'Submitting...';
  statusMessage.className = 'status-message';
  statusMessage.textContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      body: data,
    });

    const result = await response.json();

    if (response.ok && result.success) {
      submitButton.textContent = 'Submitted';
      submitButton.style.background = '#2ecc71';
      submitButton.style.color = '#fff';
      statusMessage.className = 'status-message success';
      statusMessage.textContent = 'Booking submitted successfully. A copy of your request has been sent to your email.';

      const formValues = Object.fromEntries(data.entries());
      localStorage.setItem('bookingDraft', JSON.stringify(formValues));

      const emailData = new FormData();
      emailData.append('to_email', formValues.email);
      emailData.append('subject', 'Your booking request has been received');
      emailData.append('message', `Hello ${formValues.fullName},\n\nYour booking request has been received.\n\nEvent Type: ${formValues.photoshootType}\nDate: ${formValues.date}\nTime: ${formValues.time}\nLocation: ${formValues.location || 'Not provided'}\nPeople: ${formValues.people || 'Not provided'}\nRequirements: ${formValues.requirements || 'Not provided'}\n\nWe will contact you soon.\n\nThanks,\nMANU PHOTOGRAPHY`);

      await fetch('http://localhost:8000/send-email', {
        method: 'POST',
        body: emailData,
      });
    } else {
      submitButton.disabled = false;
      submitButton.textContent = 'Submit Booking';
      submitButton.style.background = '#D4AF37';
      submitButton.style.color = 'black';
      statusMessage.className = 'status-message error';
      statusMessage.textContent = 'Booking failed: ' + (result.message || 'Please try again.');
    }
  } catch (error) {
    submitButton.disabled = false;
    submitButton.textContent = 'Submit Booking';
    submitButton.style.background = '#D4AF37';
    submitButton.style.color = 'black';
    statusMessage.className = 'status-message error';
    statusMessage.textContent = 'Booking failed: ' + error.message;
  }
});

window.addEventListener('load', function () {
  const savedDraft = localStorage.getItem('bookingDraft');
  if (savedDraft) {
    const values = JSON.parse(savedDraft);
    Object.entries(values).forEach(([name, value]) => {
      const field = bookingForm.elements[name];
      if (field) {
        field.value = value;
      }
    });
    submitButton.textContent = 'Submitted';
    submitButton.disabled = true;
    submitButton.style.background = '#2ecc71';
    submitButton.style.color = '#fff';
    statusMessage.className = 'status-message success';
    statusMessage.textContent = 'Your previous booking details are saved. You can review them below.';
  }
});
</script>

<script>
const menuToggle = document.querySelector('.menu-toggle');
const nav = document.querySelector('nav');
if (menuToggle && nav) {
  menuToggle.addEventListener('click', () => {
    const isOpen = nav.classList.toggle('open');
    document.body.classList.toggle('menu-open', isOpen);
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  document.addEventListener('click', (event) => {
    if (window.innerWidth <= 900 && nav.classList.contains('open') && !nav.contains(event.target) && !menuToggle.contains(event.target)) {
      nav.classList.remove('open');
      document.body.classList.remove('menu-open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
  });

  document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 900) {
        nav.classList.remove('open');
        document.body.classList.remove('menu-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  });
}
</script>
